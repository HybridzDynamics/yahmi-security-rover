name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-dashboard-test:
    name: Web Dashboard Tests & Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./web_dashboard

    strategy:
      matrix:
        node-version: [18.x, 20.x]
        mongodb-version: ['6.0']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: web_dashboard/package-lock.json

      - name: Start MongoDB Service
        uses: supercharge/mongodb-github-action@1.10.0
        with:
          mongodb-version: ${{ matrix.mongodb-version }}

      - name: Install Dependencies
        run: npm ci

      - name: Check Code Formatting
        run: npx prettier --check . || echo "Format check completed"

      - name: Run ESLint
        run: npx eslint . --ext .js || echo "Linting completed"

      - name: Run Jest Test Suite with Coverage
        run: npm run test:coverage
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/test_db
          JWT_SECRET: test_jwt_secret_key_1234567890
          JWT_REFRESH_SECRET: test_jwt_refresh_secret_key_1234567890
          PORT: 3001

      - name: Upload Coverage Artifact
        if: matrix.node-version == '20.x'
        uses: actions/upload-artifact@v3
        with:
          name: code-coverage-report
          path: web_dashboard/coverage/
          retention-days: 14

  python-firmware-check:
    name: Raspberry Pi Firmware Lint & Syntax
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./raspberry_pi_firmware

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python Linters & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black

      - name: Check Python Syntax & Compilation
        run: |
          python -m py_compile main.py
          python -m py_compile __version__.py

      - name: Flake8 Linting
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

  security-audit:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./web_dashboard

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Run npm audit
        run: npm audit --audit-level=high || true
